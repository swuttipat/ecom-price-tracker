# Daily unattended collection. Replaces running scripts\run.bat by hand, which meant a
# missed day whenever the laptop was off. Phase 0 (phase0-reachability.yml) proved a
# GitHub-hosted runner reaches Lazada and gets the Thai storefront, which is what makes
# this possible at all.
#
# NOTE ON THE 60-DAY TIMER: GitHub disables scheduled workflows after 60 days of repository
# inactivity, and pushes made with GITHUB_TOKEN do not reset that timer. A warning email
# comes first; one manual "Run workflow" click re-arms it.
#
# This file and scripts\run.bat are two paths to the same work. Keep them in sync: both
# call collect_lazada.py then pipeline.py, in that order.
name: Daily Lazada collection

on:
  schedule:
    # 01:00 UTC = 08:00 Asia/Bangkok
    - cron: '0 1 * * *'
  workflow_dispatch:

# Never let two runs race for the same day's raw file. Not cancel-in-progress: a run that
# is already partway through a polite, rate-limited sweep should be allowed to finish.
concurrency:
  group: daily-collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The runner is UTC. Without this the snapshot would be dated the previous day for
      # any manual run between midnight and 07:00 Bangkok, and the file name is the date.
      TZ: Asia/Bangkok

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt

      - name: Install Chromium for the browser fallback
        # Only reached when Lazada walls plain HTTP, but it has to be present before the
        # collector needs it, not after.
        run: python -m playwright install --with-deps chromium

      - name: Collect Lazada listings
        run: |
          # --no-payload because data/raw/_payloads is gitignored: saving 36 gzipped blobs
          # the runner then throws away is pure cost.
          #
          # Retry transient failures, never a wall. collect_lazada.py exits 2 for an
          # anti-bot wall and 1 for anything else. The wall is raised against the client,
          # not the URL, so knocking again only deepens the block.
          ok=0
          for attempt in 1 2 3; do
            python scripts/collect_lazada.py --no-payload && status=0 || status=$?
            if [ "$status" -eq 0 ]; then ok=1; break; fi
            if [ "$status" -eq 2 ]; then
              echo "::error::Anti-bot wall on the runner. Stopping without retrying."
              echo ""
              echo "  The wall is raised against the client, not the URL, so a retry only deepens it."
              echo ""
              echo "  Do NOT re-run this job today. Each GitHub run gets a different address from"
              echo "  Azure's pool, so tomorrow's scheduled run starts clean and will most likely"
              echo "  just work. That is the real advantage over collecting from a fixed home IP,"
              echo "  which accumulates reputation damage run after run."
              echo ""
              echo "  Only a wall three days running is a pattern worth acting on. Then cut 'pages'"
              echo "  in config/targets.csv or raise the delays in config/settings.json."
              echo ""
              echo "  scripts\\run-headed.bat does NOT help here. It fixes this laptop's own access"
              echo "  by building a trusted browser profile locally. The runner is a fresh container"
              echo "  on a different address and inherits none of that."
              exit 2
            fi
            echo "::warning::Attempt ${attempt} failed with exit ${status}. Retrying in $((attempt * 60))s."
            sleep $((attempt * 60))
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Collection failed after 3 attempts. Not a wall, so this is a transport or parsing problem."
            exit 1
          fi

      - name: Rebuild the processed tables and dashboard data
        run: python scripts/pipeline.py

      - name: Sync the dashboard into docs/ for GitHub Pages
        # docs/index.html is a copy of dashboard/index.html, not a second implementation.
        # GitHub Pages (Deploy from branch, /docs) publishes docs/ as an ISOLATED site
        # root: it never sees anything outside that folder. dashboard/index.html's
        # "../data/processed/app_data.js" reference walks off the published site and
        # 404s (found live, 2026-08-25). So the data file is duplicated one level down
        # into docs/, and the one line that loads it is rewritten to match - docs/
        # is not a byte-identical copy of dashboard/, and must not be treated as one.
        run: |
          cp dashboard/index.html docs/index.html
          sed -i 's|\.\./data/processed/app_data\.js|data/processed/app_data.js|' docs/index.html
          mkdir -p docs/data/processed
          cp data/processed/app_data.js docs/data/processed/app_data.js

      - name: Commit the new snapshot
        run: |
          git config user.name  "ecom-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "No data changes. Nothing to commit."
            exit 0
          fi
          git commit -m "data: daily collection $(date +%Y-%m-%d)"
          # In case the branch moved under us, for example a local push between runs.
          git pull --rebase --autostash origin main
          git push

      - name: Summary
        if: always()
        run: python .github/summarise.py >> "$GITHUB_STEP_SUMMARY"
